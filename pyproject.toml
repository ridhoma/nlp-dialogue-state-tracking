[project]
name = "nlp-dialogue-state-tracking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ds-core[all]",
    # project-specific deps get added here with `uv add` — see §8.2
    "openai>=3.37.0",
    "pyarrow>=25.0.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Local path, non-editable: a project gets a built snapshot of the library rather
# than tracking your ongoing edits. No remote involved.
[tool.uv.sources]
ds-core = { path = "../../lib/ds-core" }

[dependency-groups]
dev = ["ipykernel", "ruff", "pytest"]

